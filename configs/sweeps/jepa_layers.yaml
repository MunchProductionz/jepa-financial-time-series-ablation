program: ablation-study-jepa
method: grid
metric:
  name: val/mse
  goal: minimize
parameters:
  config:
    value: configs/exp/jepa_ablation.yaml
  jepa.num_jepa_layers:
    values: [1, 2, 3, 4]
  jepa.global_weight:
    values: [0.001, 0.01, 0.05, 0.1, 0.2]
  jepa.projection_dim:
    values: [32, 64, 128, 256]

