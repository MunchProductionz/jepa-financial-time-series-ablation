program: ablation-study-jepa
command:
  - ${env}
  - uv
  - run
  - ablation-study-jepa
  - run
  - ${args}
method: grid
metric:
  name: val/mse
  goal: minimize
parameters:
  config:
    value: configs/exp/lejepa_fixed_base.yaml
  jepa.mode:
    value: lejepa
  jepa.num_jepa_layers:
    values: [1, 2, 3, 4]
  jepa.lejepa.loss_mix.mode:
    value: fixed
  jepa.lejepa.loss_mix.lambda_pred:
    values: [0.0, 0.01, 0.05, 0.1]
  jepa.lejepa.loss_mix.lambda_sigreg:
    values: [0.0, 0.01, 0.05, 0.1]
  jepa.projection_dim:
    values: [64, 128, 256]
  jepa.horizons:
    values:
      - [1]
      - [60]
      - [1, 5, 20, 60]
  jepa.lejepa.detach_target:
    values: [false, true]
  jepa.lejepa.representation.mode:
    values: [projected, direct_h, adapter_whitened]
  jepa.lejepa.representation.whitening:
    values: [layer_norm, l2]
  jepa.lejepa.representation.domain_context.enabled:
    values: [false, true]
  jepa.lejepa.auxiliary.gradient_strategy.name:
    value: global_weighted
  evaluation.portfolio_quantile:
    value: 0.1
  evaluation.transaction_cost_bps:
    value: 10.0
  logging.wandb.enabled:
    value: true
  logging.wandb.mode:
    value: online
  logging.wandb.project:
    value: ablation-study-jepa
