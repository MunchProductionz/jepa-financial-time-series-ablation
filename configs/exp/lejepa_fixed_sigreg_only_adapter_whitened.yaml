defaults:
  - lejepa_fixed_base
  - _self_

run_name: tft_lejepa_fixed_sigreg_only_adapter_whitened_last1_h1

jepa:
  lejepa:
    loss_mix:
      mode: fixed
      lambda_pred: 0.0
      lambda_sigreg: 0.05
    sigreg:
      enabled: true
      apply_to: context_only
    representation:
      mode: adapter_whitened
      adapter_dim: 128
      whitening: layer_norm
      domain_context:
        enabled: false
    auxiliary:
      diagnostics:
        log_representation_stats: true

logging:
  wandb:
    tags: ["lejepa", "fixed", "sigreg_only", "adapter_whitened", "last1"]
