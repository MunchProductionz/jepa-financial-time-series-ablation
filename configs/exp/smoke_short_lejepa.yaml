defaults:
  - smoke_short_base
  - _self_

run_name: smoke_short_lejepa

model:
  target: ablation_study_jepa.models.tft_with_jepa:TFTWithJEPA

jepa:
  enabled: true
  mode: lejepa
  num_jepa_layers: 2
  layer_selection_mode: last_L
  lejepa:
    detach_target: true
    loss_mix:
      lambda_sigreg: 0.05
    sigreg:
      enabled: true
      apply_to: context_only
      num_slices: 32
      num_t: 7
      min_batch_size: 4
    auxiliary:
      gradient_strategy:
        name: global_weighted
      warmup:
        enabled: true
        start_epoch: 0
        end_epoch: 1
        start_scale: 0.5
        end_scale: 1.0
      diagnostics:
        log_aux_loss_ratios: true
        log_gradient_norms: false

logging:
  wandb:
    tags: ["smoke", "short", "lejepa", "jepa"]
