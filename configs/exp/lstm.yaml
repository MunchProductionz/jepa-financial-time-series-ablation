defaults:
  - base
  - _self_

run_name: lstm_no_jepa_1d

model:
  target: ablation_study_jepa.models.lstm:LSTMReturnForecaster
  params:
    hidden_size: 128
    num_layers: 2
    dropout: 0.2
    output_size: 1

jepa:
  enabled: false
  num_jepa_layers: 0
  layer_selection_mode: none

logging:
  wandb:
    tags: ["baseline", "no_jepa", "lstm"]

