defaults:
  - lejepa_fixed_base
  - _self_

run_name: tft_lejepa_fixed_projected_last3_h1_h5_h20

jepa:
  num_jepa_layers: 3
  layer_selection_mode: last_L
  horizons: [1, 5, 20]
  layer_weight_scheme: linear
  horizon_weight_scheme: uniform
  lejepa:
    loss_mix:
      mode: fixed
      lambda_pred: 0.05
      lambda_sigreg: 0.01

logging:
  wandb:
    tags: ["lejepa", "fixed", "projected", "multi_tap", "horizon_1_5_20"]
