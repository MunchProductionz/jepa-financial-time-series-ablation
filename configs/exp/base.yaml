seed: 42
run_name: base_tft_1d

data:
  loader: ablation_study_jepa.data.loaders:load_price_panel
  data_dir: data/prices/sp500/data
  macro_data_path: data/macro/fred_md/fred_md_1960_2025.csv
  macro_date_column: date
  macro_feature_columns:
    - "S&P 500"
    - FEDFUNDS
    - GS1
    - GS5
    - GS10
    - OILPRICEx
    # - "S&P: indust" # not present in data/macro/fred_md/fred_md_1960_2025.csv
    - "S&P div yield"
    - "S&P PE ratio"
  macro_missing: ignore
  tickers: ["AAPL", "MSFT", "NVDA", "AMZN"]
  start_date: "2015-01-01" # earliest: "1960-01-01"
  end_date: "2025-12-31" # latest: "2025-12-31"
  trading_day_indexing: true
  feature_columns:
    - "Price Open"
    - "Price High"
    - "Price Low"
    - "Price Close"
    - "Price Adj_Close"
    - Volume
    # - beta # not present in raw Yahoo OHLCV files
    # - pe_ratio # not present in raw Yahoo OHLCV files
    # - debt_to_equity # not present in raw Yahoo OHLCV files
    # - interest_rate # use FEDFUNDS from macro slow features instead
    # - vix # raw macro file has VIXCLSx, not vix
    - return_1d
    - return_5d
    - return_20d
    - volatility_20d
    - volume_zscore
    - "S&P 500"
    - FEDFUNDS
    - GS1
    - GS5
    - GS10
    - OILPRICEx
    - "S&P div yield"
    - "S&P PE ratio"
  fast_feature_columns:
    - "Price Open"
    - "Price High"
    - "Price Low"
    - "Price Close"
    - "Price Adj_Close"
    - Volume
    # - beta # not present in raw Yahoo OHLCV files
    # - pe_ratio # not present in raw Yahoo OHLCV files
    # - debt_to_equity # not present in raw Yahoo OHLCV files
    # - interest_rate # use FEDFUNDS from macro slow features instead
    # - vix # raw macro file has VIXCLSx, not vix
  slow_feature_columns:
    - "S&P 500"
    - FEDFUNDS
    - GS1
    - GS5
    - GS10
    - OILPRICEx
    - "S&P div yield"
    - "S&P PE ratio"
  target_column: target_return
  asset_id_column: ticker
  date_column: date
  price_column: "Price Close"
  volume_column: Volume
  sector_one_hot_prefix: sector_
  scaler_type: standard # values: standard, robust, none
  fit_scaler_on_train_only: true
  prediction_timing: after_close # values: after_close, before_close

features:
  price_column: "Price Close"
  volume_column: Volume
  max_missing_fraction: 0.3
  sequence:
    - "Price Open"
    - "Price High"
    - "Price Low"
    - "Price Close"
    - "Price Adj_Close"
    - Volume
    # - beta # not present in raw Yahoo OHLCV files
    # - pe_ratio # not present in raw Yahoo OHLCV files
    # - debt_to_equity # not present in raw Yahoo OHLCV files
    # - interest_rate # use FEDFUNDS from macro slow features instead
    # - vix # raw macro file has VIXCLSx, not vix
    - return_1d
    - return_5d
    - return_20d
    - volatility_20d
    - volume_zscore
    - "S&P 500"
    - FEDFUNDS
    - GS1
    - GS5
    - GS10
    - OILPRICEx
    - "S&P div yield"
    - "S&P PE ratio"
  static:
    - sector_consumer
    - sector_semiconductors
    - sector_technology
    - sector_unknown
  target:
    column: target_return
    horizon: 1
    method: forward_return # values: forward_return
  normalization:
    method: standard # values: standard, robust, none
    fit_on_train_only: true

splits:
  method: fraction # values: date, fraction
  train: 0.7
  validation: 0.2
  test: 0.1
  # For method: date, set explicit chronological cutoffs:
  # train_end: "2015-12-31"
  # val_end: "2022-12-31"
  # test_end: "2025-12-31"

sliding_window:
  enabled: true
  # When enabled, windows are counted over available trading dates and aligned so
  # the final complete window ends at the last loaded date.
  window_size_days: 2520 # ~10 years of trading days
  step_days: 252 # ~1 year of trading days
  # Checks that adjacent test sets cover dates without gaps; exact adjacency is valid.
  require_test_overlap: true

dataset:
  lookback: 60
  batch_size: 64
  num_workers: 9
  persistent_workers: true
  drop_last: false
  pin_memory: false
  include_future_window: true
  future_window: 60

model:
  target: ablation_study_jepa.models.tft:TFT
  criterion: torch.nn:MSELoss
  hidden_dim: 128
  num_transformer_blocks: 4
  num_attention_heads: 4
  num_lstm_layers: 1
  dropout: 0.1
  sequence_length: 60
  prediction_horizon: 1
  use_causal_mask: true
  use_variable_selection: false
  output_dim: 1
  optimizer:
    learning_rate: 0.0003
    weight_decay: 0.00001

jepa:
  enabled: false
  mode: contrastive # values: contrastive, lejepa
  num_jepa_layers: 0
  selected_layers: null
  layer_selection_mode: none # values: last_L, last_k, manual, all, none
  projection_dim: 128
  predictor_type: mlp # values: linear, mlp, residual_mlp
  horizons: [1]
  global_weight: 0.05
  layer_weight_scheme: linear # values: uniform, linear, exponential, manual
  layer_weight_gamma: 2.0
  manual_layer_weights: null
  horizon_weight_scheme: uniform # values: uniform, linear, exponential, manual
  manual_horizon_weights: null
  contrastive:
    temperature: 0.1
    negative_strategy: mixed # values: in_batch_all, in_batch_filtered, same_asset_far_time, different_asset_different_time, mixed
    num_negatives: null
    exclusion_window: 5
    allow_same_date_cross_asset_negatives: false
    allow_same_sector_negatives: true
    sector_filtering: false
    same_asset_negative_min_gap: 20
    memory_bank_enabled: false
    memory_bank_size: 4096
  lejepa:
    # Conservative TFT Auxiliary Baseline: sigreg.apply_to=context_only
    # Original-Style SIGReg On Both Embedding Sides: sigreg.apply_to=context_and_targets
    prediction_loss: mse # values: mse
    detach_target: true
    loss_mix:
      mode: lambda_sigreg # values: lambda_sigreg
      lambda_sigreg: 0.5
    sigreg:
      enabled: true
      apply_to: context_only # values: context_only, targets_only, context_and_targets
      num_slices: 256
      num_t: 17
      t_max: 5.0
      resample_directions_each_step: true
      min_batch_size: 8
    auxiliary:
      gradient_strategy:
        name: global_weighted # values: global_weighted, local_recompute
        detach_lower_inputs: true
        compute_target_with_no_grad: true
      warmup:
        enabled: false
        start_epoch: 0
        end_epoch: 10
        start_scale: 0.0
        end_scale: 1.0
      diagnostics:
        log_aux_loss_ratios: true
        log_gradient_norms: false

training:
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.00001
  max_epochs: 10
  accelerator: auto # values: auto, cpu, gpu, tpu, hpu, mps
  devices: auto # values: auto, integer device count, or device id list
  precision: 32
  early_stopping: true
  early_stopping_patience: 5
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  seed: 42

logging:
  wandb:
    enabled: false
    project: ablation-study-jepa
    entity: null
    mode: offline # values: online, offline, disabled
    group: null
    tags: ["baseline"]

evaluation:
  metrics: # values: mse, mae, correlation, directional_accuracy, spearman_rank_ic, rank_correlation, top_bottom_quantile_spread
    - mse
    - mae
    - correlation
    - directional_accuracy
    - spearman_rank_ic
    - top_bottom_quantile_spread
  save_predictions: true
  predictions_dir: predictions
