defaults:
  - base
  - _self_

run_name: smoke_short_base

data:
  data_dir: data/prices/smoke/short/panel.csv
  macro_data_path: null
  macro_feature_columns: []
  macro_missing: ignore
  limit: null
  start_date: null
  end_date: null
  fast_feature_columns:
    - "Price Open"
    - "Price High"
    - "Price Low"
    - "Price Close"
    - "Price Adj_Close"
    - Volume
  slow_feature_columns:
    - beta
    - pe_ratio
    - debt_to_equity
    - interest_rate
    - vix

features:
  sequence:
    - "Price Open"
    - "Price High"
    - "Price Low"
    - "Price Close"
    - "Price Adj_Close"
    - Volume
    - beta
    - pe_ratio
    - debt_to_equity
    - interest_rate
    - vix
    - return_1d
    - return_5d
    - return_20d
    - volatility_20d
    - volume_zscore
  static:
    - sector_consumer
    - sector_semiconductors
    - sector_technology
    - sector_unknown

splits:
  method: fraction
  train: 0.6
  validation: 0.2
  test: 0.2

sliding_window:
  enabled: false

dataset:
  lookback: 24
  batch_size: 16
  num_workers: 0
  persistent_workers: false
  include_future_window: true

model:
  hidden_dim: 16
  num_transformer_blocks: 2
  num_attention_heads: 4
  dropout: 0.0

jepa:
  projection_dim: 16
  horizons: [1, 5]
  global_weight: 0.02
  layer_weight_scheme: uniform
  horizon_weight_scheme: uniform

training:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  early_stopping: false
  log_every_n_steps: 1

logging:
  training_history:
    enabled: true
    save_step_metrics: false
    save_epoch_metrics: true
    log_learning_rate: false
  wandb:
    enabled: false
    tags: ["smoke", "short"]

evaluation:
  predictions_dir: predictions/smoke
